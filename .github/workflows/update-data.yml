name: Mise à jour hebdomadaire des données

on:
  schedule:
    # Tous les lundis à 09:00 UTC (05:00 heure de Montréal l'été, 04:00 l'hiver)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run data pipeline
        run: python3 scripts/update_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "artm-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes this week."
          else
            git commit -m "data: mise à jour hebdomadaire automatique ($(date -u +%Y-%m-%d))"
            git push
          fi
